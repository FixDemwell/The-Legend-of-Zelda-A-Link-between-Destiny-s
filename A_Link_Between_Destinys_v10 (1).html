 let complete=false,progress='';
 if(q.kind==='chest'){complete=!!S.f[q.item];progress=complete?'Item recuperado.':'Procure o baú marcado nesta região.'}
 else {const qm=S.f[k+'_map']??S.map;const n=Math.max(0,killedOnMap(qm)-(S.f[k+'_start']||0));complete=n>=q.need;progress='Progresso nesta sala: '+Math.min(n,q.need)+'/'+q.need+' inimigos.'}

 if(q.key==='qx5'||q.key==='qx8'){if(S.max<8)S.max++;S.hp=S.max}
 say(q.done);
}

const _edgeInv=edge;

  // cutscene auto-walk: só permite avançar diálogo, bloqueia pause/inventário
  if(typeof AW==='function'&&AW){
    if(a==='A'&&dlg)_edgeInv(a);
    return;
  }
  if(S.invUI){
    unlock();
    const list=bagList();
    if(a==='I'||a==='B'||a==='P'){S.invUI=0;return}
    if(a==='up'){S.invSel=Math.max(0,(S.invSel||0)-1);sfx(500,'triangle',.03,.04);return}
    if(a==='down'){S.invSel=Math.min(Math.max(0,list.length-1),(S.invSel||0)+1);sfx(500,'triangle',.03,.04);return}
    if(a==='A'&&list.length){bagUse(list[S.invSel||0]);return}
    return;
  }
  if(a==='I'){
    if(!title&&!endd&&!dlg&&!oc&&!S.mp&&!pm){S.invUI=1;S.invSel=0}
    return;
  }
  _edgeInv(a);
};

function ambKindForMap(){
  if(title||endd) return '';
  if(typeof wx==='function'&&wx()) return 'rain';
  const name=(D[S.map]&&D[S.map][0])||'';
  const th=D[S.map]?D[S.map][1]:2;
  if(/^Árvore Deku - /.test(name)) return 'deku';
  if(!S.day) return 'night';
  // por tema de tile
  if(th===1||th===14) return 'forest';
  if(th===10||th===15) return 'water';
  if(th===6) return 'desert';
  if(th===7) return 'ice';
  if(th===8) return 'volcano';
  if(th===5||th===11||th===4||th===0) return 'dungeon';
  if(th===9) return 'rain';
  return 'field';
}

function ambSet(kind){
  if(kind===amb.kind) {
    // atualiza volume se cfg mudou
    if(amb.gain&&AC){
      const vol=(kind==='volcano'?.05:kind==='dungeon'?.04:kind==='water'?.045:.035);
      amb.gain.gain.value=vol*(cfg&&cfg.vol!=null?cfg.vol:1)*(cfg&&cfg.sfx===0?0:1);
    }
    return;
  }
  ambStop();
  amb.kind=kind||'';
  if(!kind||title||endd) return;
  const vol=kind==='volcano'?.055:kind==='dungeon'?.045:kind==='deku'?.05:kind==='water'?.048:kind==='rain'?.04:.036;
  ambBed(kind, vol);
  amb.nextOne=60+Math.random()*90|0;
}

function ambUpdate(){
  if(!AC) return;
  // silencia se sfx off
  if(cfg&&cfg.sfx===0){ if(amb.gain) amb.gain.gain.value=0; return; }
  if(oc||mel||title||endd){ /* mantém bed baixo */ if(amb.gain) amb.gain.gain.value=Math.min(amb.gain.gain.value,.01); }
  const want=ambKindForMap();
  ambSet(want);
  if(!want||window.__dkFade) return;
  if(--amb.nextOne>0) return;
  amb.nextOne=80+Math.random()*140|0;
  // one-shots por bioma
  const table={
    forest:['bird','bird','leaf','wind'],
    field:['bird','wind','leaf','cricket'],
    night:['owl','cricket','cricket','wind'],
    water:['wave','drip','drip','wave'],
    desert:['wind','wind','ember'],
    ice:['wind','wind','creak'],
    volcano:['ember','ember','wind'],
    dungeon:['drip','drip','creak','wind'],
    deku:['creak','drip','creak','leaf'],
    rain:['wind','drip','drip']
  };
  const opts=table[want]||['wind'];
  ambOneShot(opts[Math.random()*opts.length|0]);
}

// engancha no loop principal e nas trocas de mapa
const _musAmb=mus;
mus=function(){
  _musAmb();
  try{ambUpdate()}catch(e){}
};

const _loadAmb=load;
load=function(i,x,y){
  _loadAmb(i,x,y);
  // força recálculo do ambiente na troca de sala
  amb.kind='';
  try{ambSet(ambKindForMap())}catch(e){}
};

  if(!amb.gain||!AC)return;
  if(cfg&&cfg.sfx===0) amb.gain.gain.value=0;
},1000);

[["Aperte B para tocar. Teclas 1-8: Dó Ré Mi Fá Sol Lá Si Dó.","Press B to play. Keys 1-8: C D E F G A B C.","Pulsa B para tocar. Teclas 1-8: Do Re Mi Fa Sol La Si Do.","Bで演奏。キー1〜8：ド レ ミ ファ ソ ラ シ ド。"],
["Você já sabe várias canções: Cura, Saria, Epona, Tempestade, Força, Proteção, Sol, Vento, Luz e mais.","You already know many songs: Healing, Saria, Epona, Storms, Strength, Protection, Sun, Wind, Light and more.","Ya conoces varias canciones: Curación, Saria, Epona, Tormenta, Fuerza, Protección, Sol, Viento, Luz y más.","もういくつも曲を知っている：癒し、サリア、エポナ、嵐、力、守り、太陽、風、光ほか。"],
["Experimente combinações! No modo Livre você ensaia sem ativar magias.","Try combinations! In Free mode you can practice without triggering magic.","¡Prueba combinaciones! En modo Libre ensayas sin activar magias.","いろいろ試そう！フリーモードなら魔法を発動せず練習できる。"],
["Não é uma espada, mas serve para se defender. Aperte A para atacar (dano menor).","It's not a sword, but it works for self-defense. Press A to attack (less damage).","No es una espada, pero sirve para defenderte. Pulsa A para atacar (menos daño).","剣ではないが身を守れる。Aでこうげき（ダメージ小）。"],
["Olhe para o golpe ou o projétil para bloqueá-lo. Fique parado para um bloqueio mais firme.","Face the blow or projectile to block it. Stand still for a firmer block.","Mira hacia el golpe o proyectil para bloquearlo. Quédate quieto para un bloqueo más firme.","攻撃や飛び道具の方を向いて防ごう。じっとしていればより強く防げる。"],
["Você desenterrou um BAÚ ANTIGO!","You dug up an ANCIENT CHEST!","¡Desenterraste un COFRE ANTIGUO!","古い宝箱を掘り出した！"],
["Há moedas e um bilhete: 'Leve isto ao espírito da câmara'.","There are coins and a note: 'Take this to the spirit of the chamber'.","Hay monedas y una nota: 'Lleva esto al espíritu de la cámara'.","コインとメモがある：「これを部屋の精霊に届けよ」。"],
["Você achou um FRASCO DE CORAÇÃO! +1 coração!","You found a HEART CONTAINER! +1 heart!","¡Encontraste un FRASCO DE CORAZÓN! ¡+1 corazón!","ハートの器を見つけた！ハート+1！"],
["Só passa quem tem o Selo Real. Procure-o no Campo de Hyrule.","Only those with the Royal Seal may pass. Look for it in Hyrule Field.","Solo pasa quien tiene el Sello Real. Búscalo en el Campo de Hyrule.","王家の印を持つ者だけが通れる。ハイラル平原で探せ。"],
["Bem-vindo à Loja de Kakariko! O que vai levar?","Welcome to the Kakariko Shop! What will you take?","¡Bienvenido a la Tienda de Kakariko! ¿Qué te llevas?","カカリコの店へようこそ！何を買うかい？"],
["Você é o herói lendário? Pegue 20 rupees, vai precisar.","Are you the legendary hero? Take 20 rupees, you'll need them.","¿Eres el héroe legendario? Toma 20 rupias, las necesitarás.","伝説の勇者かい？20ルピーをあげよう、きっと必要になる。"],
["Sou o Sábio do Destino. Só a Canção do Destino fere Ganomisgan de verdade.","I am the Sage of Destiny. Only the Song of Destiny truly harms Ganomisgan.","Soy el Sabio del Destino. Solo la Canción del Destino hiere de verdad a Ganomisgan.","私は運命の賢者。ガノミスガンに本当に効くのは運命の歌だけだ。"],
["Você já completou essa missão. Descanse, herói.","You already completed this quest. Rest, hero.","Ya completaste esta misión. Descansa, héroe.","このクエストはもう達成した。ゆっくり休むがよい、勇者よ。"],
["Você já me ajudou, herói. Os espíritos da floresta agradecem.","You already helped me, hero. The forest spirits are grateful.","Ya me ayudaste, héroe. Los espíritus del bosque te lo agradecen.","もう助けてもらったよ、勇者さん。森の精霊も感謝している。"],
["Obrigado! Você derrotou os monstros.","Thank you! You defeated the monsters.","¡Gracias! Derrotaste a los monstruos.","ありがとう！モンスターを倒してくれたんだね。"],
["Você aprendeu a CANÇÃO DE ZELDA!","You learned ZELDA'S LULLABY!","¡Aprendiste la CANCIÓN DE ZELDA!","ゼルダの子守歌を覚えた！"],
["Você aprendeu a CANÇÃO DO DESTINO!","You learned the SONG OF DESTINY!","¡Aprendiste la CANCIÓN DEL DESTINO!","運命の歌を覚えた！"],
["Canção da Tempestade: a chuva chegou!","Song of Storms: the rain has come!","Canción de la Tormenta: ¡llegó la lluvia!","嵐の歌：雨が降ってきた！"],
["Canção de Zelda: os monstros se acalmam...","Zelda's Lullaby: the monsters calm down...","Canción de Zelda: los monstruos se calman...","ゼルダの子守歌：モンスターがおとなしくなる…"],
["Canção do Tempo: o tempo desacelera... (invulnerável breve)","Song of Time: time slows down... (briefly invulnerable)","Canción del Tiempo: el tiempo se ralentiza... (invulnerable un instante)","時の歌：時間がゆっくりになる…（短時間無敵）"],
["Canção da Guerra: onda de choque!","Song of War: shockwave!","Canción de la Guerra: ¡onda de choque!","戦いの歌：衝撃波！"],
["Você já encontrou o baú enterrado. Não há mais nada aqui para mim.","You already found the buried chest. There is nothing more here for me.","Ya encontraste el cofre enterrado. Aquí ya no queda nada para mí.","埋もれた宝箱はもう見つけたね。ここにはもう私の用はない。"],
["Achou o baú enterrado! Eu sabia que você conseguiria.","You found the buried chest! I knew you could do it.","¡Encontraste el cofre enterrado! Sabía que podías.","埋もれた宝箱を見つけたね！きみならできると思ってた。"],
["Há um baú enterrado nesta câmara...","There is a buried chest in this chamber...","Hay un cofre enterrado en esta cámara...","この部屋には埋もれた宝箱がある…"],
["Encontre-o e volte falar comigo.","Find it and come talk to me.","Encuéntralo y vuelve a hablar conmigo.","見つけたらまた話しかけてくれ。"],
["Quatro templos guardam os Fragmentos do Destino. Sem eles o Selo Real não abre.","Four temples guard the Destiny Fragments. Without them the Royal Seal won't open.","Cuatro templos guardan los Fragmentos del Destino. Sin ellos el Sello Real no se abre.","四つの神殿に運命のかけらが眠っている。それがないと王家の印は開かない。"],
["Santuários curam sua vida de graça. Procure o brilho dourado.","Shrines heal you for free. Look for the golden glow.","Los santuarios te curan gratis. Busca el brillo dorado.","祠は無料で体力を回復してくれる。金色の輝きを探そう。"],
["Baús escondem corações. Explore os cantos dos mapas.","Chests hide hearts. Explore the corners of the maps.","Los cofres esconden corazones. Explora las esquinas de los mapas.","宝箱にはハートが隠れている。マップのすみを探そう。"],
["Os Kokiri não crescem, mas a floresta anda doente.","The Kokiri never grow up, but the forest is sick.","Los Kokiri no crecen, pero el bosque está enfermo.","コキリ族は大人にならないが、森は病んでいる。"],
["Dizem que a Grande Árvore Deku tosse há semanas.","They say the Great Deku Tree has been coughing for weeks.","Dicen que el Gran Árbol Deku tose desde hace semanas.","デクの樹は何週間も咳をしているらしい。"]

[["Impa jura que a Princesa ainda reza no Castelo.","Impa swears the Princess still prays in the Castle.","Impa jura que la Princesa aún reza en el Castillo.","インパは、姫がまだ城で祈っていると断言している。"],
["Ganomisgan sente o cheiro de heróis. Cuidado à noite.","Ganomisgan can smell heroes. Be careful at night.","Ganomisgan huele a los héroes. Cuidado de noche.","ガノミスガンは勇者の匂いを嗅ぎつける。夜は気をつけて。"],
["Gorons comem rochas e nunca perdem a calma... só o vulcão.","Gorons eat rocks and never lose their calm... only the volcano does.","Los Goron comen rocas y nunca pierden la calma... solo el volcán.","ゴロンは岩を食べ、決して取り乱さない…取り乱すのは火山だけだ。"],
["O fogo no Pico está mais bravo que o normal.","The fire on the Peak is fiercer than usual.","El fuego del Pico está más bravo de lo normal.","山頂の炎がいつもより荒れている。"],
["Nada no pântano é o que parece.","Nothing in the swamp is what it seems.","Nada en el pantano es lo que parece.","沼ではどんなものも見た目どおりではない。"],
["São quatro os Fragmentos do Destino, lembre-se.","There are four Destiny Fragments, remember.","Son cuatro los Fragmentos del Destino, recuérdalo.","運命のかけらは四つだ。忘れるな。"],
["Os Zora cantavam para a Princesa. Agora ninguém canta.","The Zora used to sing for the Princess. Now no one sings.","Los Zora cantaban para la Princesa. Ahora nadie canta.","ゾーラは姫のために歌っていた。今は誰も歌わない。"],
["A água lembra de tudo, até do que Hyrule esqueceu.","Water remembers everything, even what Hyrule forgot.","El agua lo recuerda todo, hasta lo que Hyrule olvidó.","水はすべてを覚えている。ハイラルが忘れたことさえも。"],
["Areia não perdoa quem corre.","Sand doesn't forgive those who run.","La arena no perdona a quien corre.","砂は走る者を許さない。"],
["Existe um oásis onde ninguém espera.","There is an oasis where no one expects it.","Existe un oasis donde nadie lo espera.","誰も思わない場所にオアシスがある。"],
["Cavernas respondem a quem grita. Hoje respondem sozinhas.","Caves answer those who shout. Today they answer on their own.","Las cuevas responden a quien grita. Hoy responden solas.","洞窟は叫ぶ者に応える。今日は勝手に応えている。"],
["Cristais guardam ecos de canções antigas.","Crystals hold echoes of ancient songs.","Los cristales guardan ecos de canciones antiguas.","水晶は古い歌のこだまを宿している。"],
["O vulcão despertou quando você dormiu.","The volcano awoke while you slept.","El volcán despertó mientras dormías.","きみが眠っている間に火山が目覚めた。"],
["Um mago esperou por você aqui, congelado.","A wizard waited for you here, frozen.","Un mago te esperó aquí, congelado.","魔法使いが凍りついたまま、ここできみを待っていた。"],
["Ganomisgan nasceu aqui, de um fragmento de ódio.","Ganomisgan was born here, from a shard of hatred.","Ganomisgan nació aquí, de un fragmento de odio.","ガノミスガンは憎しみのかけらからここで生まれた。"],
["Quanto mais ao sul, mais forte o guardião.","The farther south, the stronger the guardian.","Cuanto más al sur, más fuerte el guardián.","南へ行くほど守護者は強くなる。"],
["Ao sul há as Terras Esquecidas, com quatro templos.","To the south lie the Forgotten Lands, with four temples.","Al sur están las Tierras Olvidadas, con cuatro templos.","南には忘れられた地があり、四つの神殿がある。"],
["Fragmento do Destino: derrote o guardião deste templo.","Destiny Fragment: defeat this temple's guardian.","Fragmento del Destino: derrota al guardián de este templo.","運命のかけら：この神殿の守護者を倒せ。"],
["O Selo Real exige os 4 Fragmentos do Destino.","The Royal Seal requires all 4 Destiny Fragments.","El Sello Real exige los 4 Fragmentos del Destino.","王家の印には運命のかけらが4つ必要だ。"],
["Perdi uma relíquia antiga nas Terras Sombrias, no extremo sul... traga-a!","I lost an ancient relic in the Dark Lands, far to the south... bring it back!","Perdí una reliquia antigua en las Tierras Sombrías, en el extremo sur... ¡tráela!","遠い南の暗黒の地で古い遺物をなくしてしまった…取り戻してくれ！"],
["Um espírito da floresta! Traga-me a prova de que derrotou 3 monstros.","A forest spirit! Bring me proof that you defeated 3 monsters.","¡Un espíritu del bosque! Tráeme la prueba de que derrotaste a 3 monstruos.","森の精霊だ！モンスター3体を倒した証を持ってきてくれ。"],
["Você matou muitos monstros! Os espíritos te abençoam.","You slew many monsters! The spirits bless you.","¡Derrotaste a muchos monstruos! Los espíritus te bendicen.","たくさんのモンスターを倒したな！精霊の祝福あれ。"],
["A chuva nunca para aqui... ela canta uma melodia.","The rain never stops here... it sings a melody.","La lluvia nunca para aquí... canta una melodía.","ここでは雨が止まない…雨はメロディを歌っている。"],
["A chuva daqui canta uma melodia... Volte com uma ocarina e eu te ensino.","The rain here sings a melody... Come back with an ocarina and I'll teach you.","La lluvia de aquí canta una melodía... Vuelve con una ocarina y te la enseño.","ここの雨はメロディを歌う…オカリナを持ってきたら教えよう。"],
["Toque comigo a Canção da Tempestade completa: Ré Fá Dó Ré Fá Dó (teclas 2 4 8 2 4 8).","Play the full Song of Storms with me: D F C D F C (keys 2 4 8 2 4 8).","Toca conmigo la Canción de la Tormenta completa: Re Fa Do Re Fa Do (teclas 2 4 8 2 4 8).","嵐の歌を一緒に演奏しよう：レ ファ ド レ ファ ド（キー2 4 8 2 4 8）。"],
["A Canção de Zelda acalma os monstros: Lá Dó Sol, duas vezes. Teclas 6 8 5, 6 8 5.","Zelda's Lullaby calms monsters: A C G, twice. Keys 6 8 5, 6 8 5.","La Canción de Zelda calma a los monstruos: La Do Sol, dos veces. Teclas 6 8 5, 6 8 5.","ゼルダの子守歌はモンスターを鎮める：ラ ド ソ を2回。キー6 8 5、6 8 5。"],
["Este altar espera uma ocarina...","This altar awaits an ocarina...","Este altar espera una ocarina...","この祭壇はオカリナを待っている…"],
["Este templo aguarda o herói do tempo.","This temple awaits the Hero of Time.","Este templo aguarda al héroe del tiempo.","この神殿は時の勇者を待っている。"],
["Leve-a ao Salão de Ganomisgan e toque-a diante dele.","Take it to Ganomisgan's Hall and play it before him.","Llévala al Salón de Ganomisgan y tócala ante él.","ガノミスガンの間へ持って行き、彼の前で演奏せよ。"],
["Está tentando chamar a quem? Acho que está à frente do seu tempo, herói.","Who are you trying to call? I think you're ahead of your time, hero.","¿A quién intentas llamar? Creo que estás adelantado a tu tiempo, héroe.","誰を呼ぼうとしているんだ？きみは時代の先を行っているな、勇者よ。"],
["A paz voltou a este salão...","Peace has returned to this hall...","La paz ha vuelto a este salón...","この広間に平和が戻った…"],
["Só a Canção do Destino o fere de verdade: aperte B e toque! O escudo segura os projéteis.","Only the Song of Destiny truly hurts him: press B and play! The shield blocks projectiles.","Solo la Canción del Destino lo hiere de verdad: ¡pulsa B y toca! El escudo detiene los proyectiles.","彼に本当に効くのは運命の歌だけ：Bを押して演奏しよう！盾は飛び道具を防ぐ。"],
["Abra a Ocarina com B e toque: Mi Sol Si Sol Dó Si (teclas 3 5 7 5 8 7).","Open the Ocarina with B and play: E G B G C B (keys 3 5 7 5 8 7).","Abre la Ocarina con B y toca: Mi Sol Si Sol Do Si (teclas 3 5 7 5 8 7).","Bでオカリナを開き演奏：ミ ソ シ ソ ド シ（キー3 5 7 5 8 7）。"],
["Toque a Canção do Destino diante de Ganomisgan: 15 de dano! Recarrega em 20 segundos.","Play the Song of Destiny before Ganomisgan: 15 damage! Recharges in 20 seconds.","Toca la Canción del Destino ante Ganomisgan: ¡15 de daño! Se recarga en 20 segundos.","ガノミスガンの前で運命の歌を演奏：15ダメージ！20秒で再使用可能。"],
["Toque a Canção da Tempestade completa e a chuva cairá onde você quiser!","Play the full Song of Storms and rain will fall wherever you wish!","¡Toca la Canción de la Tormenta completa y la lluvia caerá donde quieras!","嵐の歌を最後まで演奏すれば、好きな場所に雨が降る！"],
["Aprenda a Canção do Destino com o Sábio.","Learn the Song of Destiny from the Sage.","Aprende la Canción del Destino con el Sabio.","賢者から運命の歌を学ぼう。"]
].forEach(a=>tx(...a));
[["As ruínas antigas... algo dorme nas profundezas.","The ancient ruins... something sleeps in the depths.","Las ruinas antiguas... algo duerme en las profundidades.","古い遺跡…深い所で何かが眠っている。"],
["A ocarina está numa caverna ao leste. Cuidado com os monstros.","The ocarina is in a cave to the east. Beware of monsters.","La ocarina está en una cueva al este. Cuidado con los monstruos.","オカリナは東の洞窟にある。モンスターに気をつけて。"],
["Sou um Kolog! A Espada dorme num baú no canto leste da clareira.","I'm a Kolog! The Sword sleeps in a chest in the east corner of the clearing.","¡Soy un Kolog! La Espada duerme en un cofre en el rincón este del claro.","ぼくはコログ！剣は広場の東のすみの宝箱で眠っているよ。"],
["Sem ela, os monstros do Campo vão te devorar.","Without it, the monsters of the Field will devour you.","Sin ella, los monstruos del Campo te devorarán.","剣がなければ、平原のモンスターに食べられちゃうよ。"],
["A Canção de Saria: Fá Lá Si (2x) ou a completa.","Saria's Song: F A B (2x) or the full one.","La Canción de Saria: Fa La Si (2x) o la completa.","サリアの歌：ファ ラ シ（2回）か、完全版。"],
["Os monstros tomaram o Campo! O Selo Real caiu num baú no sudeste.","Monsters have taken the Field! The Royal Seal fell into a chest in the southeast.","¡Los monstruos tomaron el Campo! El Sello Real cayó en un cofre al sudeste.","モンスターが平原を占領した！王家の印は南東の宝箱に落ちたぞ。"],
["Norte: Castelo. Sul: Kakariko. Leste: Lago Hylia.","North: Castle. South: Kakariko. East: Lake Hylia.","Norte: Castillo. Sur: Kakariko. Este: Lago Hylia.","北：城。南：カカリコ。東：ハイリア湖。"],
["Dizem que o herói do céu dormiu 100 anos... será você?","They say the hero of the sky slept for 100 years... could it be you?","Dicen que el héroe del cielo durmió 100 años... ¿serás tú?","空の勇者は100年眠ったという…それはきみかい？"],
["Aqui eu só vejo um pirralho de chapéu verde!","All I see here is a brat in a green cap!","¡Aquí solo veo a un mocoso con gorro verde!","ここにいるのは緑の帽子のガキだけだがな！"],
["Ao leste fica o Templo do Tempo.","The Temple of Time lies to the east.","Al este queda el Templo del Tiempo.","東に時の神殿がある。"],
["Viajante... o deserto engole os distraídos.","Traveler... the desert swallows the careless.","Viajero... el desierto se traga a los distraídos.","旅人よ…砂漠は油断した者を飲み込む。"],
["Aperte B para tocar a Ocarina. Teclas 1-8.","Press B to play the Ocarina. Keys 1-8.","Pulsa B para tocar la Ocarina. Teclas 1-8.","Bでオカリナを演奏。キー1〜8。"],
["O botão Livre deixa você ensaiar sem ativar magia.","The Free button lets you practice without triggering magic.","El botón Libre te deja ensayar sin activar magia.","フリーボタンなら魔法を発動せずに練習できる。"],
["Brrr! Dizem que o céu chora logo ao norte.","Brrr! They say the sky weeps just to the north.","¡Brrr! Dicen que el cielo llora justo al norte.","ぶるる！北ではすぐ先で空が泣いているそうだ。"],
["Use a Canção da Cura (Dó Mi Sol Mi Dó) se estiver ferido.","Use the Song of Healing (C E G E C) if you're hurt.","Usa la Canción de la Curación (Do Mi Sol Mi Do) si estás herido.","ケガをしたら癒しの歌（ド ミ ソ ミ ド）を使おう。"],
["Sou um Goron! Aqui esquenta, mas o Sábio do Destino está perto.","I'm a Goron! It gets hot here, but the Sage of Destiny is near.","¡Soy un Goron! Aquí hace calor, pero el Sabio del Destino está cerca.","おれはゴロン！ここは暑いが、運命の賢者はすぐ近くだ。"],
["Cuidado: o chefe final se cura e mira à frente de você. O escudo ajuda.","Careful: the final boss heals and aims ahead of you. The shield helps.","Cuidado: el jefe final se cura y apunta por delante de ti. El escudo ayuda.","気をつけろ：ラスボスは回復し、先読みして狙ってくる。盾が役に立つ。"],
["Este templo guarda as lágrimas da deusa.","This temple keeps the goddess's tears.","Este templo guarda las lágrimas de la diosa.","この神殿には女神の涙が眠っている。"],
["A Ocarina responde a quem tem coragem.","The Ocarina answers those with courage.","La Ocarina responde a quien tiene valor.","オカリナは勇気ある者に応える。"],
["Uuuuh... eu era um herói como você.","Ooooh... I was a hero just like you.","Uuuuh... yo era un héroe como tú.","うぅぅ…わしもきみのような勇者だったのだ。"],
["O Sábio aguarda mais adiante. Prepare o coração.","The Sage awaits further ahead. Steel your heart.","El Sabio aguarda más adelante. Prepara el corazón.","賢者はこの先で待っている。覚悟を決めよ。"],
["O vento sussurra: a última prova está logo acima.","The wind whispers: the final trial is just above.","El viento susurra: la última prueba está justo arriba.","風がささやく：最後の試練はすぐ上だ。"],
["Lá você aprenderá a Canção do Destino.","There you will learn the Song of Destiny.","Allí aprenderás la Canción del Destino.","そこで運命の歌を学ぶことになる。"],
["Pesco neste lago desde a Era do Céu.","I've fished in this lake since the Sky Era.","Pesco en este lago desde la Era del Cielo.","空の時代からこの湖で釣りをしているんだ。"],

["Descanse, herói. A luz do santuário restaura sua vida.","Rest, hero. The shrine's light restores your health.","Descansa, héroe. La luz del santuario restaura tu vida.","休むがよい、勇者よ。祠の光が体力を癒やす。"],

["Alto! A Floresta Kokiri clama por ajuda.","Halt! The Kokiri Forest cries out for help.","¡Alto! El Bosque Kokiri clama ayuda.","止まれ！コキリの森は助けを求めている。"],
["Só quem purificou a Grande Árvore Deku merece o Selo Real.","Only one who purified the Great Deku Tree deserves the Royal Seal.","Solo quien purificó al Gran Árbol Deku merece el Sello Real.","デクの樹サマを浄化した者だけが王家の印にふさわしい。"],
["Parado aí! Aqui só entra quem a Saria autoriza.","Stop right there! Only those Saria allows may enter here.","¡Alto ahí! Aquí solo entra quien Saria autoriza.","止まれ！ここはサリアが認めた者しか入れない。"],
["A Grande Árvore Deku fica ao norte da vila. Entre nela — o mal está no núcleo.","The Great Deku Tree is north of the village. Enter it — the evil is at its core.","El Gran Árbol Deku está al norte de la aldea. Entra en él: el mal está en su núcleo.","デクの樹サマは村の北にある。中へ入れ――悪は核にいる。"],
["Se a mata te confundir, toque a Canção de Saria: Fá Lá Si, duas vezes.","If the woods confuse you, play Saria's Song: F A B, twice.","Si el bosque te confunde, toca la Canción de Saria: Fa La Si, dos veces.","森で迷ったらサリアの歌を：ファ ラ シ を2回。"],
["Ao norte do Bosque Faron, a luz some entre copas imensas. É a Floresta Kokiri.","North of Faron Woods, the light fades among huge treetops. This is the Kokiri Forest.","Al norte del Bosque Faron, la luz se pierde entre copas inmensas. Es el Bosque Kokiri.","ファロンの森の北では、巨大な木々の間で光が消える。ここがコキリの森だ。"],
["Link sente a espada tremer. Algo antigo chama dentro da mata.","Link feels the sword tremble. Something ancient calls from within the woods.","Link siente que la espada tiembla. Algo antiguo llama desde el bosque.","リンクは剣が震えるのを感じた。森の奥で古い何かが呼んでいる。"],
["Link, eu sentia que vinha.","Link, I felt you were coming.","Link, sentía que vendrías.","リンク、おぬしが来るのを感じておった。"],
["Hmm! Um humano nas Montanhas! Faz cem anos que ninguém sobe aqui.","Hmm! A human in the Mountains! No one has climbed here in a hundred years.","¡Hmm! ¡Un humano en las Montañas! Hace cien años que nadie sube aquí.","ふむ！山に人間とは！百年、誰もここへ登っていない。"],
["O vulcão ruge desde que o herói adormeceu. Dizem que um dragão acordou lá embaixo.","The volcano has roared since the hero fell asleep. They say a dragon awoke down below.","El volcán ruge desde que el héroe se durmió. Dicen que un dragón despertó allá abajo.","勇者が眠ってから火山は唸り続けている。下で竜が目覚めたという。"],
["Se acalmar o Covil Vulcânico, os Gorons te chamarão de irmão.","If you calm the Volcanic Lair, the Gorons will call you brother.","Si calmas la Guarida Volcánica, los Gorons te llamarán hermano.","火山の巣を鎮めれば、ゴロンたちはおぬしを兄弟と呼ぶだろう。"],
["Sou Ruto, filha do Rei Zora. As águas já cantaram para a Princesa Zelda...","I am Ruto, daughter of the Zora King. The waters once sang for Princess Zelda...","Soy Ruto, hija del Rey Zora. Las aguas cantaron una vez para la Princesa Zelda...","わたくしはルト、ゾーラ王の娘。水はかつてゼルダ姫のために歌ったわ…"],
["Hoje elas gemem. A sombra suja o rio até o mar.","Today they moan. The shadow fouls the river all the way to the sea.","Hoy gimen. La sombra ensucia el río hasta el mar.","今は水がうめいている。影が川を海まで汚しているの。"],
["Cuidado nos charcos: criaturas saltam e cospem pedras.","Beware the puddles: creatures leap out and spit rocks.","Cuidado con los charcos: criaturas saltan y escupen piedras.","水たまりに注意：モンスターが跳び出して石を吐くわ。"],
["O deserto engoliu três caravanas desde que a sombra cresceu.","The desert has swallowed three caravans since the shadow grew.","El desierto se tragó tres caravanas desde que la sombra creció.","影が広がってから、砂漠は三つのキャラバンを飲み込んだ。"],
["Se vir um lobo cinzento rosnando, dê um passo ao lado: ele ataca em linha reta.","If you see a growling gray wolf, step aside: it charges in a straight line.","Si ves un lobo gris gruñendo, da un paso al lado: ataca en línea recta.","唸る灰色のオオカミを見たら横に避けろ。まっすぐ突進してくる。"],
["A terra treme. Um rugido seco rasga o ar.","The ground shakes. A dry roar tears through the air.","La tierra tiembla. Un rugido seco rasga el aire.","大地が揺れる。乾いた咆哮が空気を裂く。"],
["Herói adormecido... cada selo que quebrar só me aproxima da Ocarina.","Sleeping hero... every seal you break only brings me closer to the Ocarina.","Héroe dormido... cada sello que rompas solo me acerca a la Ocarina.","眠れる勇者よ…封印を解くたび、オカリナは私に近づく。"],
["Link aperta o punho. O Covil do Dragão aguarda adiante.","Link clenches his fist. The Dragon's Lair awaits ahead.","Link aprieta el puño. La Guarida del Dragón aguarda más adelante.","リンクは拳を握る。竜の巣はすぐ先だ。"],
["Congelei aqui para esperar o herói. A Era do Céu ainda sussurra nestas pedras.","I froze here to wait for the hero. The Skyward Age still whispers in these stones.","Me congelé aquí para esperar al héroe. La Era del Cielo aún susurra en estas piedras.","勇者を待つためここで凍りついた。空の時代はまだこの石にささやいている。"],
["A Fortaleza guarda o último eco da Canção do Destino. Ganomisgan a teme.","The Fortress holds the last echo of the Song of Destiny. Ganomisgan fears it.","La Fortaleza guarda el último eco de la Canción del Destino. Ganomisgan la teme.","砦には運命の歌の最後のこだまが眠る。ガノミスガンはそれを恐れている。"],
["Cuidado com arqueiros: eles recuam e disparam.","Beware of archers: they back away and shoot.","Cuidado con los arqueros: retroceden y disparan.","弓兵に注意：下がりながら撃ってくる。"],
["O céu escurece. Cada passo parece afundar no vazio.","The sky darkens. Every step seems to sink into the void.","El cielo se oscurece. Cada paso parece hundirse en el vacío.","空が暗くなる。一歩ごとに虚無へ沈むようだ。"],
["Aqui meu primeiro fragmento nasceu. Aqui você vai ficar.","My first fragment was born here. Here you will stay.","Aquí nació mi primer fragmento. Aquí te quedarás.","ここで私の最初の欠片が生まれた。ここがおまえの終わりだ。"],
["Link encara a Torre da Sombra. Alguém precisa pará-la.","Link faces the Tower of Shadow. Someone has to stop it.","Link mira la Torre de la Sombra. Alguien debe detenerla.","リンクは影の塔を見据える。誰かが止めねばならない。"],
["Link... este é o Altar Dourado, onde a Deusa deixou a primeira Ocarina.","Link... this is the Golden Altar, where the Goddess left the first Ocarina.","Link... este es el Altar Dorado, donde la Diosa dejó la primera Ocarina.","リンク…ここは黄金の祭壇。女神が最初のオカリナを残した場所よ。"],
["Quando tudo acabar, lembre-se: a canção é o verdadeiro poder.","When it's all over, remember: the song is the true power.","Cuando todo acabe, recuerda: la canción es el verdadero poder.","すべてが終わったら思い出して。本当の力は歌にあるの。"],
["Venha ao Castelo. O destino... está pronto.","Come to the Castle. Destiny... is ready.","Ven al Castillo. El destino... está listo.","お城へ来て。運命は…準備ができているわ。"],
["Os monstros assustam a gente!","The monsters scare us!","¡Los monstruos nos asustan!","モンスターがこわいよ！"],
["Você derrota 4 deles?","Can you defeat 4 of them?","¿Puedes derrotar a 4 de ellos?","4体倒してくれる？"],
["Obrigada! Eu espero aqui.","Thank you! I'll wait here.","¡Gracias! Espero aquí.","ありがとう！ここで待ってるね。"],
["Você é incrível!","You're amazing!","¡Eres increíble!","きみってすごい！"],
["A floresta está mais calma, obrigada!","The forest is calmer now, thank you!","¡El bosque está más tranquilo, gracias!","森が静かになったよ、ありがとう！"],
["Alto! Ninguém passa sem o Selo Real.","Halt! No one passes without the Royal Seal.","¡Alto! Nadie pasa sin el Sello Real.","止まれ！王家の印なき者は通さん。"],
["Pare! Ninguém passa sem o Selo Real.","Stop! No one passes without the Royal Seal.","¡Alto! Nadie pasa sin el Sello Real.","止まれ！王家の印がなければ誰も通れん。"],
["A Princesa não recebe mais ninguém desde que a sombra cresceu.","The Princess has received no one since the shadow grew.","La Princesa no recibe a nadie desde que la sombra creció.","影が広がってから、姫様は誰ともお会いにならない。"],
["...Mas dizem que o herói voltou. Talvez seja você.","...But they say the hero has returned. Perhaps it's you.","...Pero dicen que el héroe regresó. Quizá seas tú.","…だが勇者が戻ったと聞く。もしやおぬしでは。"],
["Link! Você realmente voltou.","Link! You really came back.","¡Link! Realmente volviste.","リンク！本当に戻ってきたのですね。"],
["Cem anos se passaram, mas Kakariko ainda guarda sua memória.","A hundred years have passed, but Kakariko still keeps your memory.","Pasaron cien años, pero Kakariko aún guarda tu memoria.","百年が過ぎても、カカリコ村はあなたを覚えています。"],
["Aceita meu treinamento? Ele dura pouco, mas fortalece.","Will you accept my training? It's brief, but it makes you stronger.","¿Aceptas mi entrenamiento? Dura poco, pero fortalece.","わたしの修行を受けますか？短いですが、力がつきます。"],
["Sinta a força correr em você!","Feel the strength flow through you!","¡Siente la fuerza correr en ti!","力がみなぎるのを感じなさい！"],
["Como quiser. A porta continua aberta.","As you wish. The door remains open.","Como quieras. La puerta sigue abierta.","お好きなように。扉はいつでも開いています。"],
["Cada um tem seu tempo, herói.","Everyone has their own time, hero.","Cada uno tiene su tiempo, héroe.","人にはそれぞれの時があります、勇者よ。"],

["A Ocarina será minha. O tempo será meu.","The Ocarina will be mine. Time will be mine.","La Ocarina será mía. El tiempo será mío.","オカリナは我がもの。時もまた我がものとなる。"],
["Última chance: entregue a Ocarina e viva.","Last chance: hand over the Ocarina and live.","Última oportunidad: entrega la Ocarina y vive.","最後の機会だ。オカリナを渡せば命は助けてやる。"],

["Link hesita por um instante.","Link hesitates for a moment.","Link duda por un instante.","リンクは一瞬ためらった。"],
["Medo? Ótimo. Me alimenta!","Fear? Good. It feeds me!","¿Miedo? Excelente. ¡Me alimenta!","恐れか？結構。それが私の糧だ！"],
["Bem-vindo às Ilhas Celestes, herói do tempo.","Welcome to the Sky Islands, hero of time.","Bienvenido a las Islas Celestes, héroe del tiempo.","空の島へようこそ、時の勇者よ。"],
["Eu guardo o último eco da Deusa.","I guard the Goddess's last echo.","Guardo el último eco de la Diosa.","わたしは女神の最後のこだまを守っています。"],
["Ganomisgan não é Ganon. É o medo que Ganon deixou no mundo.","Ganomisgan is not Ganon. He is the fear Ganon left in the world.","Ganomisgan no es Ganon. Es el miedo que Ganon dejó en el mundo.","ガノミスガンはガノンではない。ガノンが世界に残した恐怖そのものです。"],
["Quem o teme, o alimenta. Quem o enfrenta, o enfraquece.","Whoever fears him feeds him. Whoever faces him weakens him.","Quien le teme, lo alimenta. Quien lo enfrenta, lo debilita.","恐れる者は彼を育て、立ち向かう者は彼を弱らせます。"],

["Lembre-se: o medo é a arma dele.","Remember: fear is his weapon.","Recuerda: el miedo es su arma.","忘れないで。恐れこそが彼の武器です。"],

["No Templo Celeste dorme a Lâmina do Destino.","In the Sky Temple sleeps the Blade of Destiny.","En el Templo Celeste duerme la Hoja del Destino.","天空の神殿には運命の刃が眠っている。"],

["O templo recompensa você.","The temple rewards you.","El templo te recompensa.","神殿がそなたに報いる。"],
["Esta é a Ilha do Eco. Aqui a Deusa escondeu um eco da Triforce, para o dia em que o herói precisasse dele.","This is Echo Island. Here the Goddess hid an echo of the Triforce, for the day the hero would need it.","Esta es la Isla del Eco. Aquí la Diosa escondió un eco de la Trifuerza, para el día en que el héroe lo necesitara.","ここはこだまの島。女神は勇者が必要とする日のため、トライフォースのこだまをここに隠したのです。"],
["Sem o Cristal do Eco, a Canção do Destino não ferirá Ganomisgan.","Without the Echo Crystal, the Song of Destiny will not harm Ganomisgan.","Sin el Cristal del Eco, la Canción del Destino no herirá a Ganomisgan.","こだまの水晶がなければ、運命の歌はガノミスガンに効きません。"],
["Volte a Hyrule. A Zelda desta era espera, e Ganomisgan também.","Return to Hyrule. This era's Zelda awaits, and so does Ganomisgan.","Vuelve a Hyrule. La Zelda de esta era espera, y Ganomisgan también.","ハイラルへ戻りなさい。この時代のゼルダが待っています。ガノミスガンもです。"],
["Aqui repousa a memória de Skyloft, engolida pelo tempo.","Here rests the memory of Skyloft, swallowed by time.","Aquí reposa la memoria de Skyloft, tragada por el tiempo.","ここにはスカイロフトの記憶が眠る。時に飲み込まれたものだ。"],
