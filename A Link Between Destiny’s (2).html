 let complete=false,progress='';
 if(q.kind==='chest'){complete=!!S.f[q.item];progress=complete?'Item recuperado.':'Procure o baú marcado nesta região.'}
 else {const qm=S.f[k+'_map']??S.map;const n=Math.max(0,killedOnMap(qm)-(S.f[k+'_start']||0));complete=n>=q.need;progress='Progresso nesta sala: '+Math.min(n,q.need)+'/'+q.need+' inimigos.'}

 if(q.key==='qx5'||q.key==='qx8'){if(S.max<8)S.max++;S.hp=S.max}
 say(q.done);
}

const _edgeInv=edge;

  if(typeof AW==='function'&&AW){
    if(a==='A'&&dlg)_edgeInv(a);

  }
  if(S.invUI){
    unlock();

    if(a==='I'||a==='B'||a==='P'){S.invUI=0;return}
    if(a==='up'){S.invSel=Math.max(0,(S.invSel||0)-1);sfx(500,'triangle',.03,.04);return}
    if(a==='down'){S.invSel=Math.min(Math.max(0,list.length-1),(S.invSel||0)+1);sfx(500,'triangle',.03,.04);return}
    if(a==='A'&&list.length){bagUse(list[S.invSel||0]);return}
    return;
  }
  if(a==='I'){
    if(!title&&!endd&&!dlg&&!oc&&!S.mp&&!pm){S.invUI=1;S.invSel=0}
    return;
  }
  _edgeInv(a);
};

function ambKindForMap(){
  if(title||endd) return '';
  if(typeof wx==='function'&&wx()) return 'rain';
  const name=(D[S.map]&&D[S.map][0])||'';
  const th=D[S.map]?D[S.map][1]:2;
  if(/^Árvore Deku - /.test(name)) return 'deku';
  if(!S.day) return 'night';
  // por tema de tile
  if(th===1||th===14) return 'forest';
  if(th===10||th===15) return 'water';
  if(th===6) return 'desert';
  if(th===7) return 'ice';
  if(th===8) return 'volcano';
  if(th===5||th===11||th===4||th===0) return 'dungeon';
  if(th===9) return 'rain';
  return 'field';
}

function ambSet(kind){
  if(kind===amb.kind) {
    // atualiza volume se cfg mudou
    if(amb.gain&&AC){
      const vol=(kind==='volcano'?.05:kind==='dungeon'?.04:kind==='water'?.045:.035);
      amb.gain.gain.value=vol*(cfg&&cfg.vol!=null?cfg.vol:1)*(cfg&&cfg.sfx===0?0:1);
    }
    return;
  }
  ambStop();
  amb.kind=kind||'';
  if(!kind||title||endd) return;
  const vol=kind==='volcano'?.055:kind==='dungeon'?.045:kind==='deku'?.05:kind==='water'?.048:kind==='rain'?.04:.036;
  ambBed(kind, vol);
  amb.nextOne=60+Math.random()*90|0;
}

function ambUpdate(){
  if(!AC) return;
  // silencia se sfx off
  if(cfg&&cfg.sfx===0){ if(amb.gain) amb.gain.gain.value=0; return; }
  if(oc||mel||title||endd){ /* mantém bed baixo */ if(amb.gain) amb.gain.gain.value=Math.min(amb.gain.gain.value,.01); }
  const want=ambKindForMap();
  ambSet(want);
  if(!want||window.__dkFade) return;
  if(--amb.nextOne>0) return;
  amb.nextOne=80+Math.random()*140|0;
  // one-shots por bioma
  const table={
    forest:['bird','bird','leaf','wind'],
    field:['bird','wind','leaf','cricket'],
    night:['owl','cricket','cricket','wind'],
    water:['wave','drip','drip','wave'],
    desert:['wind','wind','ember'],
    ice:['wind','wind','creak'],
    volcano:['ember','ember','wind'],
    dungeon:['drip','drip','creak','wind'],
    deku:['creak','drip','creak','leaf'],
    rain:['wind','drip','drip']
  };
  const opts=table[want]||['wind'];
  ambOneShot(opts[Math.random()*opts.length|0]);
}

// engancha no loop principal e nas trocas de mapa
const _musAmb=mus;

  _musAmb();

  amb.kind='';
  try{ambSet(ambKindForMap())}catch(e){}
};
